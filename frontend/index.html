<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Affiliate Program Management</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1b1f2a;--mu:#667085;--pr:#4f46e5;--bd:#e4e7ec;--ok:#12805c;--bad:#b42318}
@media(prefers-color-scheme:dark){:root{--bg:#10131a;--card:#181c26;--tx:#e8eaf0;--mu:#98a2b3;--bd:#2a3040}}
*{box-sizing:border-box}body{margin:0;font:14px system-ui,sans-serif;background:var(--bg);color:var(--tx)}
header{display:flex;gap:8px;align-items:center;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--bd);flex-wrap:wrap}
header b{margin-right:12px}nav{display:flex;gap:4px;flex-wrap:wrap;flex:1}
button,.btn{background:var(--pr);color:#fff;border:0;border-radius:6px;padding:6px 12px;cursor:pointer;font:inherit}
button.sec{background:transparent;color:var(--tx);border:1px solid var(--bd)}button.on{background:var(--pr);color:#fff}
main{max-width:1100px;margin:16px auto;padding:0 16px}.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}.k{font-size:12px;color:var(--mu)}.v{font-size:20px;font-weight:600}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--bd)}th{color:var(--mu);font-weight:500}
.wrap{overflow-x:auto}input,select{padding:6px 8px;border:1px solid var(--bd);border-radius:6px;background:var(--card);color:var(--tx);font:inherit}
form{display:flex;gap:8px;flex-wrap:wrap;align-items:end}label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mu)}
.msg{padding:8px 12px;border-radius:6px;margin-bottom:10px}.err{background:#fee4e2;color:var(--bad)}.okm{background:#d1fadf;color:var(--ok)}
.pill{padding:2px 8px;border-radius:99px;background:var(--bd);font-size:12px}h3{margin:0 0 10px}code{word-break:break-all}
</style></head><body>
<div id="app"></div>
<script>
const $=s=>document.querySelector(s);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const S={token:localStorage.getItem("tok"),me:null,view:null,msg:null,mode:"login"};
async function api(path,opt={}){
  const r=await fetch(path,{method:opt.method||"GET",headers:{"Content-Type":"application/json",...(S.token?{Authorization:"Bearer "+S.token}:{})},body:opt.body?JSON.stringify(opt.body):undefined});
  const t=await r.text();let d=null;try{d=t?JSON.parse(t):null}catch{}
  if(!r.ok){if(r.status===401&&S.token&&!path.includes("/auth/login")){logout();}throw new Error((d&&d.detail)||r.statusText)}
  return d}
const flash=(t,ok)=>{S.msg={t,ok}};
const money=v=>Number(v||0).toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2});
const fd=f=>Object.fromEntries(new FormData(f).entries());
function table(cols,rows){return `<div class="wrap"><table><tr>${cols.map(c=>`<th>${esc(c[0])}</th>`).join("")}</tr>${rows.map(r=>`<tr>${cols.map(c=>`<td>${c[2]?c[1](r):esc(c[1](r))}</td>`).join("")}</tr>`).join("")||`<tr><td colspan="${cols.length}" class="k">Nothing here yet</td></tr>`}</table></div>`}
const kpis=o=>`<div class="grid">${o.map(([k,v])=>`<div class="card"><div class="k">${esc(k)}</div><div class="v">${esc(v)}</div></div>`).join("")}</div>`;
function logout(){S.token=null;S.me=null;localStorage.removeItem("tok");render()}
async function loadMe(){if(!S.token)return;try{S.me=await api("/api/auth/me");S.view=S.view||(S.me.user.role==="AFFILIATE"?"a-dash":"dash")}catch{S.token=null}}

const STAFF=[["dash","Dashboard"],["affs","Affiliates"],["prods","Products & Rules"],["orders","Orders & Fraud"],["pay","Payouts"],["settings","Settings"]];
const AFF=[["a-dash","Dashboard"],["a-links","Links"],["a-comm","Commissions"],["a-pay","Payouts"]];

async function render(){
  const root=$("#app");
  if(!S.token||!S.me){root.innerHTML=authView();bindAuth();return}
  const nav=S.me.user.role==="AFFILIATE"?AFF:STAFF;
  let body="";try{body=await VIEWS[S.view]()}catch(e){body=`<div class="msg err">${esc(e.message)}</div>`}
  const m=S.msg?`<div class="msg ${S.msg.ok?"okm":"err"}">${esc(S.msg.t)}</div>`:"";S.msg=null;
  root.innerHTML=`<header><b>Affiliate Platform</b><nav>${nav.map(([k,l])=>`<button class="${S.view===k?"on":"sec"}" data-v="${k}">${l}</button>`).join("")}</nav><span class="k">${esc(S.me.user.name)} (${esc(S.me.user.role)})</span><button class="sec" id="out">Log out</button></header><main>${m}${body}</main>`;
  root.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>{S.view=b.dataset.v;render()});
  $("#out").onclick=()=>api("/api/auth/logout",{method:"POST"}).finally(logout);
  root.querySelectorAll("form[data-act]").forEach(f=>f.onsubmit=async e=>{e.preventDefault();try{await ACTIONS[f.dataset.act](fd(f),f)}catch(x){flash(x.message,false)}render()});
  root.querySelectorAll("[data-do]").forEach(b=>b.onclick=async()=>{try{await ACTIONS[b.dataset.do](b.dataset.id,b.dataset.arg)}catch(x){flash(x.message,false)}render()});
}
function authView(){
  const t=S.mode;const m=S.msg?`<div class="msg ${S.msg.ok?"okm":"err"}">${esc(S.msg.t)}</div>`:"";S.msg=null;
  const f={login:`<label>Email<input name="email" type="email" required></label><label>Password<input name="password" type="password" required></label>`,
  biz:`<label>Company<input name="org_name" required></label><label>Your name<input name="name" required></label><label>Email<input name="email" type="email" required></label><label>Password (8+)<input name="password" type="password" minlength="8" required></label>`,
  aff:`<label>Program slug<input name="org_slug" required></label><label>Name<input name="name" required></label><label>Email<input name="email" type="email" required></label><label>Password (8+)<input name="password" type="password" minlength="8" required></label><label>Website<input name="website"></label><label>Channels<input name="marketing_channels"></label><label><span><input type="checkbox" name="accept_terms" value="1"> I accept the affiliate terms</span></label>`};
  return `<main style="max-width:520px"><div class="card"><h3>Affiliate Program Management</h3>${m}<p><button class="${t==="login"?"on":"sec"}" data-m="login">Log in</button> <button class="${t==="biz"?"on":"sec"}" data-m="biz">Register business</button> <button class="${t==="aff"?"on":"sec"}" data-m="aff">Apply as affiliate</button></p><form id="af">${f[t]}<button>Submit</button></form></div></main>`}
function bindAuth(){
  document.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{S.mode=b.dataset.m;render()});
  $("#af").onsubmit=async e=>{e.preventDefault();const d=fd(e.target);
    try{let r;
      if(S.mode==="login")r=await api("/api/auth/login",{method:"POST",body:d});
      else if(S.mode==="biz")r=await api("/api/auth/register",{method:"POST",body:d});
      else{d.accept_terms=d.accept_terms==="1";r=await api("/api/auth/register-affiliate",{method:"POST",body:d})}
      S.token=r.access_token;localStorage.setItem("tok",S.token);S.view=null;await loadMe();flash("Welcome!",true)}
    catch(x){flash(x.message,false)}render()}}

const sel=(name,items,v="id",l="name",extra="")=>`<select name="${name}" ${extra}>${items.map(i=>`<option value="${i[v]}">${esc(i[l])}</option>`).join("")}</select>`;
const VIEWS={
 async dash(){const d=await api("/api/analytics/business");return kpis([["Affiliates (active)",`${d.total_affiliates} (${d.active_affiliates})`],["Pending applications",d.pending_applications],["Clicks",d.clicks],["Conversions",d.conversions],["Conversion rate",d.conversion_rate+"%"],["Revenue",money(d.revenue)],["Commission earned",money(d.commission_earned)],["Reversed",money(d.reversed)],["Pending payouts",money(d.pending_payouts)],["Paid out",money(d.completed_payouts)],["Refund rate",d.refund_rate+"%"],["Flagged",d.flagged_conversions]])+`<div class="card"><h3>Top affiliates</h3>${table([["Affiliate",r=>r.name],["Commission",r=>money(r.commission)]],d.top_affiliates)}</div><div class="card"><h3>Campaigns</h3>${table([["Campaign",r=>r.campaign],["Clicks",r=>r.clicks],["Conversions",r=>r.conversions],["Revenue",r=>money(r.revenue)]],d.campaigns)}</div>`},
 async affs(){const a=await api("/api/affiliates");const btn=(r,act,l)=>`<button class="sec" data-do="${act}" data-id="${r.id}">${l}</button> `;
  return `<div class="card"><h3>Affiliates</h3>${table([["Code",r=>r.code],["Name",r=>r.name],["Email",r=>r.email],["Status",r=>`<span class="pill">${esc(r.status)}</span>`,1],["Actions",r=>(["PENDING","UNDER_REVIEW"].includes(r.status)?btn(r,"approve","Approve")+btn(r,"reject","Reject"):"")+(r.status==="APPROVED"?btn(r,"suspend","Suspend"):"")+(r.status==="SUSPENDED"?btn(r,"reactivate","Reactivate"):""),1]],a)}</div>
  <div class="card"><h3>Create coupon</h3><form data-act="coupon"><label>Affiliate${sel("affiliate_id",a.filter(x=>x.status==="APPROVED"),"id","code")}</label><label>Code<input name="code" required></label><button>Create</button></form></div>`},
 async prods(){const [p,r,t,o]=await Promise.all([api("/api/products"),api("/api/commission-rules"),api("/api/commission-tiers"),api("/api/organization")]);
  return `<div class="card"><h3>Products</h3>${table([["Name",x=>x.name],["Price",x=>money(x.price)],["URL",x=>x.base_url],["Status",x=>x.status]],p)}<form data-act="product"><label>Name<input name="name" required></label><label>Price<input name="price" type="number" step="0.01" min="0" required></label><label>Product URL<input name="base_url" type="url" required></label><button>Add product</button></form></div>
  <div class="card"><h3>Commission rules <span class="k">(mode: ${esc(o.commission_mode)}, default ${esc(o.default_rate)}%)</span></h3>${table([["Product",x=>(p.find(y=>y.id===x.product_id)||{name:"All products"}).name],["Type",x=>x.type],["Rate %",x=>x.rate],["Fixed",x=>money(x.fixed_amount)],["Priority",x=>x.priority]],r)}<form data-act="rule"><label>Product<select name="product_id"><option value="">All</option>${p.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join("")}</select></label><label>Type<select name="type"><option>PERCENT</option><option>FIXED</option></select></label><label>Rate %<input name="rate" type="number" step="0.01" value="0"></label><label>Fixed<input name="fixed_amount" type="number" step="0.01" value="0"></label><button>Add rule</button></form></div>
  <div class="card"><h3>Tiers</h3>${table([["Name",x=>x.name],["From",x=>x.min_value],["To",x=>x.max_value??"∞"],["Rate %",x=>x.commission_rate],["",x=>`<button class="sec" data-do="deltier" data-id="${x.id}">Delete</button>`,1]],t)}<form data-act="tier"><label>Name<input name="name" required></label><label>From<input name="min_value" type="number" step="0.01" required></label><label>To<input name="max_value" type="number" step="0.01"></label><label>Rate %<input name="commission_rate" type="number" step="0.01" required></label><button>Add tier</button></form></div>`},
 async orders(){const [c,p]=await Promise.all([api("/api/conversions"),api("/api/products")]);
  return `<div class="card"><h3>Record test order (same call your store sends to <code>/api/webhooks/orders</code>)</h3><form data-act="order"><label>Order ID<input name="external_order_id" required value="ORD-${Date.now()}"></label><label>Customer<input name="customer_reference" type="email" required></label><label>Product${sel("product_id",p)}</label><label>Amount<input name="amount" type="number" step="0.01" required></label><label>Discount<input name="discount" type="number" step="0.01" value="0"></label><label>Tracking ID<input name="tracking_id"></label><label>Coupon<input name="coupon_code"></label><button>Submit order</button></form></div>
  <div class="card"><h3>Conversions</h3>${table([["Order",x=>x.external_order_id],["Affiliate",x=>x.affiliate_id],["Eligible",x=>money(x.eligible_amount)],["Via",x=>x.attribution_type],["Status",x=>x.status],["Flag",x=>x.flag_status+(x.flag_reason?" – "+x.flag_reason:"")],["",x=>x.flag_status==="FLAGGED"?`<button class="sec" data-do="clear" data-id="${x.id}">Clear</button> <button class="sec" data-do="rejectc" data-id="${x.id}">Reject</button>`:`<button class="sec" data-do="refund" data-id="${x.external_order_id}">Refund</button>`,1]],c)}</div>`},
 async pay(){const b=await api("/api/payouts/batches");const acts=x=>({PENDING_REVIEW:`<button data-do="approveb" data-id="${x.id}">Approve</button>`,APPROVED:`<button data-do="processb" data-id="${x.id}">Process</button>`})[x.status]||"";
  let det="";if(b[0]){const d=await api("/api/payouts/batches/"+b[0].id);det=`<div class="card"><h3>Latest batch #${b[0].id}</h3>${table([["Affiliate",x=>x.affiliate_name],["Amount",x=>money(x.amount)],["Status",x=>x.status],["",x=>x.status==="PROCESSING"?`<button class="sec" data-do="simok" data-id="${x.id}">Simulate success</button> <button class="sec" data-do="simfail" data-id="${x.id}">Simulate failure</button>`:x.status==="FAILED"?`<button class="sec" data-do="retry" data-id="${x.id}">Retry</button>`:"",1]],d.payouts)}</div>`}
  return `<div class="card"><h3>Payout batches</h3><button data-do="gen">Generate payout batch</button>${table([["#",x=>x.id],["Affiliates",x=>x.affiliate_count],["Total",x=>money(x.total_amount)],["On hold",x=>money(x.on_hold_amount)],["Status",x=>x.status],["",acts,1]],b)}</div>${det}`},
 async settings(){const o=await api("/api/organization");const L=await api("/api/audit-logs?limit=15");
  return `<div class="card"><h3>Program settings</h3><p class="k">Affiliate sign-up slug: <code>${esc(o.slug)}</code> · Order webhook API key: <code>${esc(o.api_key||"owner only")}</code></p><form data-act="org">${[["attribution_days","Attribution window (days)"],["hold_days","Holding period (days)"],["min_payout","Minimum payout"],["default_rate","Default rate %"]].map(([k,l])=>`<label>${l}<input name="${k}" type="number" step="0.01" value="${esc(o[k])}"></label>`).join("")}<label>Mode<select name="commission_mode">${["RULES","SALES_TIER","COUNT_TIER"].map(m=>`<option ${m===o.commission_mode?"selected":""}>${m}</option>`).join("")}</select></label><button>Save</button></form></div><div class="card"><h3>Recent audit log</h3>${table([["When",x=>x.created_at],["Action",x=>x.action],["Resource",x=>x.resource_type+" "+(x.resource_id||"")]],L)}</div>`},
 async "a-dash"(){const d=await api("/api/analytics/affiliate");const b=d.balance;return kpis([["Clicks",d.clicks],["Conversions",d.conversions],["Conversion rate",d.conversion_rate+"%"],["Revenue",money(d.revenue)],["Commission earned",money(d.commission_earned)],["Avg order value",money(d.average_order_value)],["Pending (hold)",money(b.pending)],["On review",money(b.on_hold)],["Payable",money(b.payable)],["Paid",money(b.paid)],["Reversed",money(b.reversed)]])+(S.me.affiliate.status!=="APPROVED"?`<div class="msg err">Your application status: ${esc(S.me.affiliate.status)}</div>`:"")+`<div class="card"><h3>Top products</h3>${table([["Product",x=>x.product],["Sales",x=>x.conversions],["Revenue",x=>money(x.revenue)]],d.top_products)}</div>`},
 async "a-links"(){const [l,p,c]=await Promise.all([api("/api/referral-links"),api("/api/products"),api("/api/campaigns")]);
  return `<div class="card"><h3>Create referral link</h3><form data-act="link"><label>Product${sel("product_id",p.filter(x=>x.status==="ACTIVE"))}</label><label>Campaign<select name="campaign_id"><option value="">None</option>${c.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join("")}</select></label><button>Generate</button></form></div><div class="card"><h3>My links</h3>${table([["Product",x=>(p.find(y=>y.id===x.product_id)||{}).name],["Link",x=>`<code>${esc(x.url)}</code>`,1]],l)}</div>`},
 async "a-comm"(){const e=await api("/api/commissions");return `<div class="card"><h3>Ledger</h3>${table([["Date",x=>x.created_at.slice(0,10)],["Type",x=>x.type],["Amount",x=>money(x.amount)],["Status",x=>x.status],["Description",x=>x.description]],e)}</div>`},
 async "a-pay"(){const p=await api("/api/payouts");return `<div class="card"><h3>Payout history</h3>${table([["Date",x=>x.created_at.slice(0,10)],["Amount",x=>money(x.amount)],["Status",x=>x.status]],p)}</div>`}
};
const post=(u,b)=>api(u,{method:"POST",body:b}),clean=o=>Object.fromEntries(Object.entries(o).filter(([,v])=>v!==""));
const ACTIONS={
 approve:id=>post(`/api/affiliates/${id}/approve`),reject:id=>post(`/api/affiliates/${id}/reject`),suspend:id=>post(`/api/affiliates/${id}/suspend`),reactivate:id=>post(`/api/affiliates/${id}/reactivate`),
 coupon:async d=>{await post("/api/coupons",{affiliate_id:+d.affiliate_id,code:d.code});flash("Coupon created",true)},
 product:async d=>{await post("/api/products",d);flash("Product added",true)},
 rule:async d=>{d.product_id=d.product_id?+d.product_id:null;await post("/api/commission-rules",d);flash("Rule added",true)},
 tier:async d=>{await post("/api/commission-tiers",clean(d));flash("Tier added",true)},
 deltier:async id=>{await api("/api/commission-tiers/"+id,{method:"DELETE"})},
 order:async(d)=>{const o=await api("/api/webhooks/orders",{method:"POST",body:{...clean(d),product_id:+d.product_id}});flash(o.duplicate?"Duplicate order ignored":o.conversion?"Order recorded and attributed":"Order recorded (no affiliate attributed)",true)},
 clear:id=>post(`/api/conversions/${id}/review`,{decision:"clear"}),rejectc:id=>post(`/api/conversions/${id}/review`,{decision:"reject"}),
 refund:async id=>{if(confirm("Fully refund this order?")){await post("/api/refunds",{external_order_id:id,reason:"Refund"});flash("Refund applied",true)}},
 gen:async()=>{await post("/api/payouts/generate");flash("Batch generated",true)},approveb:id=>post(`/api/payouts/batches/${id}/approve`),processb:id=>post(`/api/payouts/batches/${id}/process`),
 simok:id=>post(`/api/payouts/${id}/simulate`,{outcome:"completed"}),simfail:id=>post(`/api/payouts/${id}/simulate`,{outcome:"failed"}),retry:id=>post(`/api/payouts/${id}/retry`),
 org:async d=>{await api("/api/organization",{method:"PATCH",body:d});flash("Settings saved",true)},
 link:async d=>{await post("/api/referral-links",{product_id:+d.product_id,campaign_id:d.campaign_id?+d.campaign_id:null});flash("Link created",true)}
};
loadMe().then(render);
</script></body></html>
